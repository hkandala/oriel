name: ci

on:
  push:
    branches: [main]
    paths-ignore: &docs-only [plan/**, docs/**, resources/**, '**/*.md']
  pull_request:
    paths-ignore: *docs-only
  # Ad-hoc UI tests: gh workflow run ci.yml --ref main -f only_testing=OrielUITests/OrielUITests/testA,...
  # The on-demand tests (Makefile's ON_DEMAND): gh workflow run ci.yml --ref main -f on_demand=true
  workflow_dispatch:
    inputs:
      only_testing:
        description: Comma-separated -only-testing ids; empty runs everything
        default: ''
      on_demand:
        description: Run only the on-demand tests (stress, costs, frame records, look scenes), on 4 machines
        type: boolean
        default: false

env:
  HERDR_VERSION: 0.9.5
  HERDR_SHA256: fb77c2232a05a8035421382c894392f4174e4e38a18e48af3dd0290157c3a7e2

permissions:
  contents: read

# A dispatch run gets its own group: it never cancels the push run or another dispatch.
concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  # 5 parallel jobs, the account's macOS limit (plan/ci.md, Speed): shard 0 also runs lint, both builds and HerdrKit's
  # tests (they need herdr), and gets fewer UI tests for it. An ad-hoc run of chosen tests takes one.
  test:
    runs-on: xcode-27
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.only_testing && '[0]' || inputs.on_demand && '[0, 1, 2, 3]' || '[0, 1, 2, 3, 4]') }}
    env:
      CHECKS: ${{ matrix.shard == 0 && !inputs.only_testing && !inputs.on_demand }}
    steps:
      - uses: actions/checkout@v7
      - if: env.CHECKS == 'true'
        run: brew update --quiet && brew bundle
      - if: env.CHECKS != 'true'
        run: brew install xcbeautify
      - name: install herdr
        run: |
          mkdir -p ~/.local/bin
          curl -fsSL -o ~/.local/bin/herdr "https://github.com/herdrdev/herdr/releases/download/v$HERDR_VERSION/herdr-macos-aarch64"
          echo "$HERDR_SHA256  $HOME/.local/bin/herdr" | shasum -a 256 -c
          chmod +x ~/.local/bin/herdr
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # The app finds herdr through the login shell, like a user's rc file after install.
          echo 'export PATH="$HOME/.local/bin:$PATH"' | tee -a ~/.zshrc >> ~/.bash_profile
      - if: env.CHECKS == 'true'
        run: make lint
      # Its macOS build is the UI tests' too: their build then adds only the test bundle.
      - if: env.CHECKS == 'true'
        run: make build
      - if: env.CHECKS == 'true'
        run: make test
      # The remote-host tests' machines (phase 26).
      - run: scripts/ci-sshd.sh
      - if: ${{ inputs.only_testing }}
        run: make e2e
        env:
          ONLY: ${{ inputs.only_testing }}
      - if: ${{ !inputs.only_testing && !inputs.on_demand }}
        # SHARD_HEAD (scripts/shard.py): shard 0's checks above and the strip check below take about 210 s, less the
        # 60–80 s its UI test build saves on the app built by make build.
        run: make e2e SHARD=${{ matrix.shard }}/5 SHARD_HEAD=140
      - if: ${{ inputs.on_demand }}
        run: make e2e SHARD=${{ matrix.shard }}/4 ON_DEMAND_ONLY=1
      - if: ${{ !cancelled() && env.CHECKS == 'true' }}
        run: make strip-check
      # What the remote-host tests' sshd saw, and the SSH runs left.
      - if: failure()
        run: tail -60 /tmp/oriel-sshd/sshd.log; pgrep -lf 'ssh ' || true
      # Green runs too: their screen recordings are the phases' screenshots.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-xcresult-${{ matrix.shard }}
          path: |
            .build/DerivedData/e2e.xcresult
            .build/strip-check
