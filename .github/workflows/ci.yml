name: ci

on:
  push:
    branches: [main]
    paths-ignore: &docs-only [playbook/**, docs/**, resources/**, '**/*.md']
  pull_request:
    paths-ignore: *docs-only
  # Ad-hoc UI tests: gh workflow run ci.yml --ref main -f only_testing=OrielUITests/OrielUITests/testA,...
  # The on-demand tests (Makefile's ON_DEMAND): gh workflow run ci.yml --ref main -f on_demand=true
  workflow_dispatch:
    inputs:
      only_testing:
        description: Comma-separated -only-testing ids; empty runs everything
        default: ''
      on_demand:
        description: Run only the on-demand tests (stress, costs, frame records, look scenes), on 4 machines
        type: boolean
        default: false

env:
  HERDR_VERSION: 0.9.5
  HERDR_SHA256: fb77c2232a05a8035421382c894392f4174e4e38a18e48af3dd0290157c3a7e2

permissions:
  contents: read

# Push runs cancel older push runs on the same ref; a dispatch gets its own group and never cancels anything.
concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  # Push and pull request: the fast checks only (playbook/ci.md, Layout). The UI tests run on dispatch.
  checks:
    if: github.event_name != 'workflow_dispatch'
    runs-on: xcode-27
    # The grammars' clones take about 8 minutes when the package cache misses.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - &packages
        uses: actions/cache@v4
        with:
          path: .build/DerivedData/SourcePackages
          key: packages-${{ hashFiles('Oriel.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/*/Package.swift') }}
      - run: brew update --quiet && brew bundle
      - name: install herdr
        run: &install-herdr |
          mkdir -p ~/.local/bin
          curl -fsSL -o ~/.local/bin/herdr "https://github.com/herdrdev/herdr/releases/download/v$HERDR_VERSION/herdr-macos-aarch64"
          echo "$HERDR_SHA256  $HOME/.local/bin/herdr" | shasum -a 256 -c
          chmod +x ~/.local/bin/herdr
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # The app finds herdr through the login shell, like a user's rc file after install.
          echo 'export PATH="$HOME/.local/bin:$PATH"' | tee -a ~/.zshrc >> ~/.bash_profile
      - run: make lint
      - run: make build
      # The UI tests compile, though they do not run here.
      - run: make build-tests
      - run: make test
      - run: make strip-check
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: strip-check
          path: .build/strip-check

  # Dispatch: the UI tests on 5 parallel jobs, the account's macOS limit; a run of chosen tests takes one, the
  # on-demand tests take 4.
  test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    # About 8 minutes of package clones on a cache miss, 2 to build, 10 of tests.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.only_testing && '[0]' || inputs.on_demand && '[0, 1, 2, 3]' || '[0, 1, 2, 3, 4]') }}
    steps:
      - uses: actions/checkout@v7
      - *packages
      - run: brew install xcbeautify
      - name: install herdr
        run: *install-herdr
      # The remote-host tests' machines.
      - run: scripts/ci-sshd.sh
      - if: ${{ inputs.only_testing }}
        run: make e2e
        env:
          ONLY: ${{ inputs.only_testing }}
      - if: ${{ !inputs.only_testing }}
        run: make e2e SHARD=${{ matrix.shard }}/${{ strategy.job-total }} ${{ inputs.on_demand && 'ON_DEMAND_ONLY=1' || '' }}
      # What the remote-host tests' sshd saw, and the SSH runs left.
      - if: failure()
        run: tail -60 /tmp/oriel-sshd/sshd.log; pgrep -lf 'ssh ' || true
      # Green runs too: their screen recordings are the phases' screenshots.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-xcresult-${{ matrix.shard }}
          path: .build/DerivedData/e2e.xcresult
