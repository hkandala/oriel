name: ci

on:
  push:
    branches: [main]
    paths-ignore: &docs-only [plan/**, docs/**, resources/**, '**/*.md']
  pull_request:
    paths-ignore: *docs-only
  # Ad-hoc UI tests: gh workflow run ci.yml --ref main -f only_testing=OrielUITests/OrielUITests/testA,...
  workflow_dispatch:
    inputs:
      only_testing:
        description: Comma-separated -only-testing ids; empty runs everything
        default: ''

env:
  HERDR_VERSION: 0.9.5
  HERDR_SHA256: fb77c2232a05a8035421382c894392f4174e4e38a18e48af3dd0290157c3a7e2

permissions:
  contents: read

# A dispatch run gets its own group: it never cancels the push run or another dispatch.
concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  # One job: macOS runs at most 5 jobs at once, and the UI tests take 4. HerdrKit's integration tests need herdr.
  lint-build:
    if: ${{ !inputs.only_testing }}
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: brew update --quiet && brew bundle
      - &install-herdr
        name: install herdr
        run: |
          mkdir -p ~/.local/bin
          curl -fsSL -o ~/.local/bin/herdr "https://github.com/herdrdev/herdr/releases/download/v$HERDR_VERSION/herdr-macos-aarch64"
          echo "$HERDR_SHA256  $HOME/.local/bin/herdr" | shasum -a 256 -c
          chmod +x ~/.local/bin/herdr
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # The app finds herdr through the login shell, like a user's rc file after install.
          echo 'export PATH="$HOME/.local/bin:$PATH"' | tee -a ~/.zshrc >> ~/.bash_profile
      - run: make lint
      - run: make build
      - run: make test

  # 4 parallel jobs (plan/ci.md, Speed); an ad-hoc run of chosen tests in one.
  test-e2e:
    runs-on: xcode-27
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.only_testing && '[0]' || '[0, 1, 2, 3]') }}
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcbeautify
      - *install-herdr
      # The remote-host tests' machines (phase 26).
      - run: scripts/ci-sshd.sh
      - if: ${{ inputs.only_testing }}
        run: make e2e
        env:
          ONLY: ${{ inputs.only_testing }}
      - if: ${{ !inputs.only_testing }}
        run: make e2e SHARD=${{ matrix.shard }}/4
      - if: ${{ matrix.shard == 0 }}
        run: make strip-check
      # Green runs too: their screen recordings are the phases' screenshots.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-xcresult-${{ matrix.shard }}
          path: |
            .build/DerivedData/e2e.xcresult
            .build/strip-check
